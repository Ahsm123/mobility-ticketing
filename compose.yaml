services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres/init:/docker-entrypoint-initdb.d
      - ./database/postgres/migrations/011_ticketing_integrity.sql:/docker-entrypoint-initdb.d/020_ticketing_integrity.sql:ro

  pgweb:
    image: sosedoff/pgweb
    environment:
      DATABASE_URL: postgres://mobility:mobility@postgres:5432/mobility?sslmode=disable
    ports:
      - "8080:8081"
    depends_on:
      - postgres
    restart: unless-stopped
