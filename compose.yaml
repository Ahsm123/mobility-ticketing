services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    volumes:
      - ./database/redis:/scripts:ro
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres/init:/docker-entrypoint-initdb.d
      - ./database/postgres/migrations:/migrations:ro
      - ./database/postgres/tests:/tests:ro
  
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mobility-mongo:/data/db
      - ./database/mongodb:/scripts:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping:1}).ok ? 0 : 1)" ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  pgweb:
    image: sosedoff/pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://mobility:mobility@postgres:5432/mobility?sslmode=disable
    ports:
      - "8080:8081"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  mobility-mongo:
